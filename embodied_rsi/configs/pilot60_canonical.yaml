# Pilot-60 canonical protocol (Pilot v0.8, seed 20260915).
# Same 60 tasks / same order as the historical OpenETA Pilot-60 manifest, run
# under the Canonical Multimodal ReAct Planner-Executor Agent.
seed: 20260915

roles:
  experience: 30
  id: 10
  transfer: 10
  retention: 10

total: 60
probe_checkpoints: [S000, S030]
probe_update_enabled: false

agent:
  config: configs/agent/canonical_react.yaml

# 1 planner turn = exactly 1 source environment action, so the source
# max_env_steps budget becomes max_agent_actions (no OpenETA turn budget).
budgets:
  episode_timeout_s: 1200
  planner_max_output_tokens: 2048
  planner_validation_retries: 2
  max_rsi_injection_tokens: 8192

  max_agent_actions:
    EB-ALFRED: 30
    EB-Habitat: 60
    SpatialWorld: 60
    AsgardBench: 60
    TVRBench: 100
